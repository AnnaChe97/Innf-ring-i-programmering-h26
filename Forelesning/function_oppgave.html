<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions, oppgave 1</title>
</head>
<body>

    <script>
        const people = ["Anna", "Marius", "Susanne", "Monica", "Arne", "Zoltan", "Beate"]

        function sortArray(array) {

            //Sortere arrayen alfabetisk
            array.sort()

            //Lage en ny p-tag
            const ptag = document.createElement("p")

            //Fylle ptag med array, kommaseparert
            ptag.innerHTML = array.join(", ")

            //Skrive ut p-tag til nettside
            document.body.appendChild(ptag)

            //Testutskrift
            console.log(ptag)
            

        }
        sortArray(people)


    </script>
</body>
</html>
