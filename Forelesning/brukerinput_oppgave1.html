<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brukerinput Oppgave 1</title>
</head>
<body>
    <section>
        <input type="text" name="firstname" id="firstname" placeholder="Fornavn" />
        <button id="save">Lagre</button>
        <h1>Navn:</h1>
        <ul id="names">

        </ul>
        

        <script>
            const names = ["Anna", "Jonas", "Marius", "Marie"]


            function namePrint(){
            let html = ""
            names.map(name => {html += "<li>" + name + "</li>"})
            document.getElementById("names").innerHTML = html
            }
            
            document.getElementById("save").addEventListener("click", function(event){
                event.preventDefault()
                names.push(document.getElementById("firstname").value)
                console.log(names)
                namePrint()
            })
        </script>
    </section>
</body>
</html>
